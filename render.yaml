services:
  - type: web
    name: travel-ai-assistant-backend
    runtime: docker
    rootDir: backend
    plan: free
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: TAVILY_API_KEY
        sync: false
      - key: SERPAPI_API_KEY
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://travel-ai-assistant-frontend.onrender.com

  - type: web
    name: travel-ai-assistant-frontend
    runtime: docker
    rootDir: frontend
    plan: free
    envVars:
      - key: VITE_API_URL
        value: https://travel-ai-assistant-backend.onrender.com
